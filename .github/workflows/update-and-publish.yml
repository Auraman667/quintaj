name: Aggiorna circolari e pubblica QuintaJ

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 7-21 * * *'
      timezone: Europe/Rome

permissions:
  contents: read

concurrency:
  group: quintaj-pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - id: check
        name: Ferma il programma dopo l’estate 2027
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(TZ=Europe/Rome date +%F)" > '2027-08-31' ]]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            if [[ '${{ github.event_name }}' == 'schedule' ]]; then
              gh api --method PUT 'repos/${{ github.repository }}/actions/workflows/update-and-publish.yml/disable'
            fi
          else
            echo 'active=true' >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: gate
    if: needs.gate.outputs.active == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Ripristina l’archivio di lettura dei PDF
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache
          key: quintaj-pdf-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: quintaj-pdf-v1-
      - run: npm ci --no-audit --no-fund
      - name: Controlla circolari, PDF e orario fino al 31 agosto 2027
        run: npm run update
      - run: npm test
      - run: npm run build
      - name: Conserva l’ultimo aggiornamento pubblico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna circolari e orario della 5J'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
