name: Timer aggiornamenti QuintaJ (15/30 minuti)

# Lo scheduler di GitHub salta quasi tutti i giri programmati, quindi il timer è un job che resta acceso:
# - ogni 15 minuti controlla se sul sito della scuola ci sono circolari nuove; se sì, avvia subito l'aggiornamento;
# - ogni 30 minuti avvia comunque l'aggiornamento completo (rettifiche, orario, avvisi della città).
# Dopo ~5 ore e mezza riavvia sé stesso; il cron serve solo a far ripartire la catena se si interrompe.
on:
  workflow_dispatch:
  schedule:
    - cron: '7 */2 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: quintaj-keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Controllo ogni 15 minuti, aggiornamento ogni 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(TZ=Europe/Rome date +%F)" > '2027-08-31' ]]; then echo 'Anno scolastico finito: timer fermo'; echo STOP > stop.txt; exit 0; fi
          start() { gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/update-and-publish.yml/dispatches" -f ref=main || echo 'Avvio non riuscito, riprovo al prossimo giro'; }
          for i in $(seq 1 22); do
            now=$(TZ=Europe/Rome date '+%d/%m %H:%M')
            out=$(node scripts/check-new.mjs 2>&1 || true); echo "$out"
            n=$(echo "$out" | sed -n 's/^new=//p' | tail -1)
            if [[ "${n:-0}" -gt 0 ]]; then echo "$now – circolari nuove: aggiorno subito"; start
            elif (( i % 2 == 1 )); then echo "$now – aggiornamento dei 30 minuti"; start
            else echo "$now – nessuna circolare nuova"; fi
            sleep 900
          done
      - name: Riavvia il timer
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f stop.txt ]]; then exit 0; fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/keeper.yml/dispatches" -f ref=main
